<body class="bg-canvas text-ink font-body antialiased min-h-[1024px] flex flex-col" data-stitch-vh="min-h-[1024px]===min-h-screen">

  <!-- GNB -->
  <header class="sticky top-0 z-30 bg-canvas border-b border-hairline-soft">
    <div class="max-w-[1280px] mx-auto px-lg h-14 flex items-center justify-between gap-lg">
      <div class="flex items-center gap-xxl">
        <a href="/" class="inline-flex items-center gap-xs text-ink rounded-xs">
          <span class="w-6 h-6 rounded-xs bg-primary text-on-primary inline-flex items-center justify-center font-mono text-caption">C</span>
          <span data-design-text-token="button" class="font-button text-button text-ink">커리어랩</span>
        </a>
        <nav aria-label="주 메뉴" class="hidden md:flex items-center gap-lg">
          <a href="/courses" data-design-text-token="body-sm" class="font-body text-body-sm text-ink hover:text-ink-muted">과정</a>
          <a href="#briefing" data-design-text-token="body-sm" class="inline-flex items-center gap-xs font-body text-body-sm text-ink-muted hover:text-ink">
            <span>설명회</span>
            <span data-design-text-token="caption" class="font-caption text-caption bg-surface-2 text-ink-muted px-xs py-xxs rounded-xs">준비중</span>
          </a>
        </nav>
      </div>
      <div class="flex items-center gap-sm">
        <a href="/login" data-design-text-token="body-sm" class="font-body text-body-sm text-ink px-sm py-xs rounded-md bg-surface-2">로그인</a>
        <a href="/signup" data-component-id="button-primary" data-component-type="button" data-component-variant="primary" class="inline-flex items-center justify-center bg-primary text-on-primary font-button text-button px-md py-sm min-h-10 rounded-md hover:opacity-90">
          <span data-design-text-token="button">회원가입</span>
        </a>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-[1280px] w-full mx-auto px-lg py-xxl flex items-start justify-center">
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-xxl w-full max-w-4xl items-start">
      <!-- 1. 로그인 카드 -->
      <section class="bg-surface-1 border border-hairline rounded-xl p-xl flex flex-col gap-lg">
        <div class="flex flex-col gap-xs">
          <span data-design-text-token="eyebrow" class="font-eyebrow text-eyebrow text-ink-muted">기존 회원</span>
          <h1 data-design-text-token="headline" class="font-headline text-headline text-ink">로그인</h1>
        </div>

        <form class="flex flex-col gap-md">
          <div class="flex flex-col gap-xs">
            <label for="login-email" data-design-text-token="body-sm" class="font-body text-body-sm text-ink">이메일</label>
            <input id="login-email" type="email" placeholder="name@example.com" class="bg-surface-1 border border-hairline rounded-md px-sm py-sm min-h-11 font-body text-body text-ink placeholder:text-ink-muted focus:border-ink focus:ring-0">
          </div>
          <div class="flex flex-col gap-xs">
            <label for="login-password" data-design-text-token="body-sm" class="font-body text-body-sm text-ink">비밀번호</label>
            <input id="login-password" type="password" placeholder="비밀번호 입력" class="bg-surface-1 border border-hairline rounded-md px-sm py-sm min-h-11 font-body text-body text-ink placeholder:text-ink-muted focus:border-ink focus:ring-0">
          </div>
          <button type="submit" data-component-id="button-primary" data-component-type="button" data-component-variant="primary" class="w-full inline-flex items-center justify-center bg-primary text-on-primary font-button text-button px-md py-sm min-h-11 rounded-md hover:opacity-90 mt-xs">
            <span data-design-text-token="button">로그인</span>
          </button>
        </form>

        <p data-design-text-token="body-sm" class="font-body text-body-sm text-ink-muted text-center pt-sm border-t border-hairline-soft">
          계정이 없나요? <a href="#signup-card" class="text-ink underline underline-offset-4">회원가입</a>
        </p>
      </section>

      <!-- 2. 회원가입 카드 -->
      <section id="signup-card" class="bg-surface-1 border border-hairline rounded-xl p-xl flex flex-col gap-lg">
        <div class="flex flex-col gap-xs">
          <span data-design-text-token="eyebrow" class="font-eyebrow text-eyebrow text-ink-muted">신규 지원자</span>
          <h2 data-design-text-token="headline" class="font-headline text-headline text-ink">회원가입</h2>
        </div>

        <form class="flex flex-col gap-md">
          <div class="flex flex-col gap-xs">
            <label for="signup-email" data-design-text-token="body-sm" class="font-body text-body-sm text-ink">이메일 *</label>
            <input id="signup-email" type="email" required placeholder="name@example.com" class="bg-surface-1 border border-hairline rounded-md px-sm py-sm min-h-11 font-body text-body text-ink placeholder:text-ink-muted focus:border-ink focus:ring-0">
          </div>
          <div class="flex flex-col gap-xs">
            <label for="signup-password" data-design-text-token="body-sm" class="font-body text-body-sm text-ink">비밀번호 *</label>
            <input id="signup-password" type="password" required placeholder="8자 이상 영문, 숫자 조합" class="bg-surface-1 border border-hairline rounded-md px-sm py-sm min-h-11 font-body text-body text-ink placeholder:text-ink-muted focus:border-ink focus:ring-0">
          </div>
          <div class="flex flex-col gap-xs">
            <label for="signup-password-confirm" data-design-text-token="body-sm" class="font-body text-body-sm text-ink">비밀번호 확인 *</label>
            <input id="signup-password-confirm" type="password" required placeholder="비밀번호 재입력" class="bg-surface-1 border border-hairline rounded-md px-sm py-sm min-h-11 font-body text-body text-ink placeholder:text-ink-muted focus:border-ink focus:ring-0">
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-md">
            <div class="flex flex-col gap-xs">
              <label for="signup-name" data-design-text-token="body-sm" class="font-body text-body-sm text-ink">이름 *</label>
              <input id="signup-name" type="text" required placeholder="홍길동" class="bg-surface-1 border border-hairline rounded-md px-sm py-sm min-h-11 font-body text-body text-ink placeholder:text-ink-muted focus:border-ink focus:ring-0">
            </div>
            <div class="flex flex-col gap-xs">
              <label for="signup-phone" data-design-text-token="body-sm" class="font-body text-body-sm text-ink">연락처 *</label>
              <input id="signup-phone" type="tel" required placeholder="010-1234-5678" class="bg-surface-1 border border-hairline rounded-md px-sm py-sm min-h-11 font-body text-body text-ink placeholder:text-ink-muted focus:border-ink focus:ring-0">
            </div>
          </div>

          <label class="flex items-start gap-sm pt-xs cursor-pointer">
            <input type="checkbox" required class="mt-xxs rounded-xs border-hairline text-primary focus:ring-primary">
            <span data-design-text-token="body-sm" class="font-body text-body-sm text-ink-muted">이용약관 및 개인정보 수집·이용에 동의합니다 (필수)</span>
          </label>

          <button type="submit" data-component-id="button-primary" data-component-type="button" data-component-variant="primary" class="w-full inline-flex items-center justify-center bg-primary text-on-primary font-button text-button px-md py-sm min-h-11 rounded-md hover:opacity-90 mt-xs">
            <span data-design-text-token="button">가입하기</span>
          </button>
        </form>
      </section>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-canvas border-t border-hairline">
    <div class="max-w-[1280px] mx-auto px-lg py-xxl flex flex-col md:flex-row justify-between gap-xl">
      <div class="flex flex-col gap-sm">
        <div class="inline-flex items-center gap-xs">
          <span class="w-5 h-5 rounded-xs bg-primary text-on-primary inline-flex items-center justify-center font-mono text-caption">C</span>
          <span data-design-text-token="button" class="font-button text-button text-ink">커리어랩</span>
        </div>
        <p data-design-text-token="caption" class="font-caption text-caption text-ink-muted">
          주식회사 커리어랩 · 대표 김태현 · 사업자등록번호 211-88-94510 · 원격평생교육시설 신고번호 제2026-서울강남-0184호
        </p>
      </div>
      <div class="flex flex-wrap items-center gap-lg">
        <a href="/terms" data-design-text-token="caption" class="font-caption text-caption text-ink-muted hover:text-ink">이용약관</a>
        <a href="/privacy" data-design-text-token="caption" class="font-caption text-caption text-ink-muted hover:text-ink">개인정보처리방침</a>
        <a href="/refund" data-design-text-token="caption" class="font-caption text-caption text-ink-muted hover:text-ink">환불 규정</a>
      </div>
    </div>
  </footer>


</body></html>
