<!DOCTYPE html><html lang="ko"><head>

        'report-pink': '#db2777',
        'report-lime': '#65a30d',
        'report-orange': '#f97316',

      },

      },

        'headline': ['28px', { lineHeight: '34px', letterSpacing: '-0.5px', fontWeight: '500' }],
        'card-title': ['22px', { lineHeight: '28px', letterSpacing: '-0.3px', fontWeight: '500' }],
        'subhead': ['20px', { lineHeight: '28px', letterSpacing: '-0.2px', fontWeight: '400' }],
        'body-lg': ['18px', { lineHeight: '27px', letterSpacing: '-0.1px', fontWeight: '400' }],

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=block" rel="stylesheet">
  <style>.material-symbols-outlined, .material-symbols-rounded, .material-symbols-sharp, .material-icons { display: inline-block; width: 1em; height: 1em; line-height: 1 !important; box-sizing: content-box; overflow: hidden; white-space: nowrap; direction: ltr; vertical-align: middle; }</style>
</head>
<body class="bg-canvas text-ink font-body antialiased min-h-[1024px] flex" data-stitch-vh="min-h-[1024px]===min-h-screen">

  <!-- Admin Sidebar -->
  <aside class="w-60 shrink-0 bg-surface-1 border-r border-hairline min-h-[1024px] flex flex-col justify-between p-lg" data-stitch-vh="min-h-[1024px]===min-h-screen">
    <div class="flex flex-col gap-xl">
      <a href="/admin" class="inline-flex items-center gap-xs text-ink">
        <span class="w-6 h-6 rounded-xs bg-primary text-on-primary inline-flex items-center justify-center font-mono text-caption">C</span>
        <span data-design-text-token="button" class="font-button text-button text-ink">커리어랩</span>
        <span data-design-text-token="caption" class="font-caption text-caption bg-surface-2 text-ink-muted px-xs py-xxs rounded-xs">관리자</span>
      </a>
      <nav aria-label="관리자 메뉴" class="flex flex-col gap-xxs">
        <a href="/admin" data-design-text-token="body-sm" class="text-ink-muted font-body text-body-sm px-sm py-sm rounded-md hover:text-ink hover:bg-canvas">대시보드</a>
        <a href="/admin/courses" data-design-text-token="body-sm" class="bg-surface-2 text-ink font-body text-body-sm px-sm py-sm rounded-md">과정 관리</a>
        <a href="/admin/cohorts" data-design-text-token="body-sm" class="text-ink-muted font-body text-body-sm px-sm py-sm rounded-md hover:text-ink hover:bg-canvas">기수 관리</a>
        <a href="/admin/cohorts/12/applications" data-design-text-token="body-sm" class="text-ink-muted font-body text-body-sm px-sm py-sm rounded-md hover:text-ink hover:bg-canvas">지원자 심사</a>
        <a href="/admin/payments" data-design-text-token="body-sm" class="text-ink-muted font-body text-body-sm px-sm py-sm rounded-md hover:text-ink hover:bg-canvas">결제·환불 관리</a>
      </nav>
    </div>
    <div class="pt-md border-t border-hairline-soft flex items-center justify-between">
      <span data-design-text-token="body-sm" class="font-body text-body-sm text-ink">운영자 김민수</span>
      <a href="/logout" data-design-text-token="caption" class="font-caption text-caption text-ink-muted hover:text-ink">로그아웃</a>
    </div>
  </aside>

  <main class="flex-1 p-xl flex flex-col gap-xl min-w-0">
    <div class="flex items-center justify-between">
      <h1 data-design-text-token="display-md" class="font-display text-display-md-mobile md:text-display-md text-ink">과정 관리</h1>
      <button type="button" data-component-id="button-primary" data-component-type="button" data-component-variant="primary" class="inline-flex items-center justify-center bg-primary text-on-primary font-button text-button px-md py-sm min-h-10 rounded-md hover:opacity-90">
        <span data-design-text-token="button">과정 등록</span>
      </button>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-xl items-start">
      <!-- 1. 과정 목록 -->
      <section class="lg:col-span-7 bg-surface-1 border border-hairline rounded-xl overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="border-b border-hairline bg-canvas">
              <th class="px-lg py-sm font-caption text-caption text-ink-muted">분야</th>
              <th class="px-lg py-sm font-caption text-caption text-ink-muted">과정명</th>
              <th class="px-lg py-sm font-caption text-caption text-ink-muted">공개</th>
              <th class="px-lg py-sm font-caption text-caption text-ink-muted">기수 수</th>
              <th class="px-lg py-sm font-caption text-caption text-ink-muted text-right">관리</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-hairline-soft">
            <tr>
              <td class="px-lg py-md font-body text-body-sm text-ink-muted">백엔드</td>
              <td class="px-lg py-md font-body text-body-sm text-ink">백엔드 자바 스프링 부트캠프</td>
              <td class="px-lg py-md font-body text-body-sm text-ink">공개</td>
              <td class="px-lg py-md font-body text-body-sm text-ink tabular-nums">12</td>
              <td class="px-lg py-md text-right"><button type="button" class="font-caption text-caption text-ink underline whitespace-nowrap">수정</button></td>
            </tr>
            <tr>
              <td class="px-lg py-md font-body text-body-sm text-ink-muted">프론트엔드</td>
              <td class="px-lg py-md font-body text-body-sm text-ink">프론트엔드 React &amp; TS 부트캠프</td>
              <td class="px-lg py-md font-body text-body-sm text-ink">공개</td>
              <td class="px-lg py-md font-body text-body-sm text-ink tabular-nums">9</td>
              <td class="px-lg py-md text-right"><button type="button" class="font-caption text-caption text-ink underline whitespace-nowrap">수정</button></td>
            </tr>
            <tr>
              <td class="px-lg py-md font-body text-body-sm text-ink-muted">디자인</td>
              <td class="px-lg py-md font-body text-body-sm text-ink">프로덕트 UI/UX 디자인 부트캠프</td>
              <td class="px-lg py-md font-body text-body-sm text-ink-muted">비공개</td>
              <td class="px-lg py-md font-body text-body-sm text-ink tabular-nums">7</td>
              <td class="px-lg py-md text-right"><button type="button" class="font-caption text-caption text-ink underline whitespace-nowrap">수정</button></td>
            </tr>
            <tr>
              <td class="px-lg py-md font-body text-body-sm text-ink-muted">PM</td>
              <td class="px-lg py-md font-body text-body-sm text-ink">IT 프로덕트 매니저 부트캠프</td>
              <td class="px-lg py-md font-body text-body-sm text-ink">공개</td>
              <td class="px-lg py-md font-body text-body-sm text-ink tabular-nums">6</td>
              <td class="px-lg py-md text-right"><button type="button" class="font-caption text-caption text-ink underline whitespace-nowrap">수정</button></td>
            </tr>
          </tbody>
        </table>
      </section>

      <!-- 2. 과정 등록·수정 폼 -->
      <section class="lg:col-span-5 bg-surface-1 border border-hairline rounded-xl p-lg flex flex-col gap-md">
        <h2 data-design-text-token="card-title" class="font-card text-card-title text-ink">과정 등록 · 수정</h2>
        <form class="flex flex-col gap-md">
          <div class="flex flex-col gap-xs">
            <label for="course-name" data-design-text-token="body-sm" class="font-body text-body-sm text-ink">과정명 *</label>
            <input id="course-name" type="text" value="백엔드 자바 스프링 부트캠프" class="bg-surface-1 border border-hairline rounded-md px-sm py-sm min-h-10 font-body text-body-sm text-ink focus:border-ink focus:ring-0">
          </div>
          <div class="flex flex-col gap-xs">
            <label for="course-cat" data-design-text-token="body-sm" class="font-body text-body-sm text-ink">분야 *</label>
            <select id="course-cat" class="bg-surface-1 border border-hairline rounded-md px-sm py-sm min-h-10 font-body text-body-sm text-ink focus:border-ink focus:ring-0">
              <option selected>백엔드</option>
              <option>프론트엔드</option>
              <option>UI/UX 디자인</option>
              <option>PM</option>
            </select>
          </div>
          <div class="flex flex-col gap-xs">
            <label for="course-summary" data-design-text-token="body-sm" class="font-body text-body-sm text-ink">한 줄 소개</label>
            <input id="course-summary" type="text" value="대용량 트래픽 처리와 MSA 설계까지 실무 아키텍처 완성" class="bg-surface-1 border border-hairline rounded-md px-sm py-sm min-h-10 font-body text-body-sm text-ink focus:border-ink focus:ring-0">
          </div>
          <div class="flex flex-col gap-xs">
            <label for="course-desc" data-design-text-token="body-sm" class="font-body text-body-sm text-ink">상세 소개</label>
            <textarea id="course-desc" rows="3" class="bg-surface-1 border border-hairline rounded-md p-sm font-body text-body-sm text-ink focus:border-ink focus:ring-0">Java와 Spring Boot를 기반으로 실무 아키텍처를 학습합니다.</textarea>
          </div>
          <div class="flex flex-col gap-xs">
            <div class="flex items-center justify-between">
              <span data-design-text-token="body-sm" class="font-body text-body-sm text-ink">커리큘럼</span>
              <button type="button" class="font-caption text-caption text-ink underline">+ 주차 추가</button>
            </div>
            <div class="bg-canvas border border-hairline-soft rounded-md p-sm flex items-center justify-between">
              <span data-design-text-token="caption" class="font-caption text-caption text-ink">1~4주차 · Java 핵심과 객체지향 설계</span>
              <button type="button" class="font-caption text-caption text-ink-muted hover:text-ink">삭제</button>
            </div>
          </div>
          <label class="flex items-center gap-sm cursor-pointer">
            <input type="checkbox" checked class="rounded-xs border-hairline text-primary focus:ring-primary">
            <span data-design-text-token="body-sm" class="font-body text-body-sm text-ink">과정 공개</span>
          </label>
          <div class="flex items-center gap-sm pt-sm border-t border-hairline-soft">
            <button type="submit" data-component-id="button-primary" data-component-type="button" data-component-variant="primary" class="flex-1 inline-flex items-center justify-center bg-primary text-on-primary font-button text-button px-md py-sm min-h-10 rounded-md hover:opacity-90">
              <span data-design-text-token="button">저장</span>
            </button>
            <button type="button" data-component-id="button-secondary" data-component-type="button" data-component-variant="secondary" class="inline-flex items-center justify-center bg-surface-1 text-ink border border-hairline font-button text-button px-md py-sm min-h-10 rounded-md hover:bg-surface-2">
              <span data-design-text-token="button">취소</span>
            </button>
          </div>
        </form>
      </section>
    </div>
  </main>


</body></html>
