  <style>.material-symbols-outlined, .material-symbols-rounded, .material-symbols-sharp, .material-icons { display: inline-block; width: 1em; height: 1em; line-height: 1 !important; box-sizing: content-box; overflow: hidden; white-space: nowrap; direction: ltr; vertical-align: middle; }</style>

<body class="bg-canvas text-ink font-body antialiased min-h-[1024px] flex flex-col" data-stitch-vh="min-h-[1024px]===min-h-screen">

  <!-- Logged-in GNB -->
  <header class="sticky top-0 z-30 bg-canvas border-b border-hairline-soft">
    <div class="max-w-[1280px] mx-auto px-lg h-14 flex items-center justify-between gap-lg">
      <div class="flex items-center gap-xxl">
        <a href="/" class="inline-flex items-center gap-xs text-ink rounded-xs">
          <span class="w-6 h-6 rounded-xs bg-primary text-on-primary inline-flex items-center justify-center font-mono text-caption">C</span>
          <span data-design-text-token="button" class="font-button text-button text-ink">커리어랩</span>
        </a>
        <nav aria-label="주 메뉴" class="hidden md:flex items-center gap-lg">
          <a href="/courses" data-design-text-token="body-sm" class="font-body text-body-sm text-ink hover:text-ink-muted">과정</a>
          <a href="#briefing" data-design-text-token="body-sm" class="inline-flex items-center gap-xs font-body text-body-sm text-ink-muted hover:text-ink">
            <span>설명회</span>
            <span data-design-text-token="caption" class="font-caption text-caption bg-surface-2 text-ink-muted px-xs py-xxs rounded-xs">준비중</span>
          </a>
        </nav>
      </div>
      <div class="flex items-center gap-sm">
        <a href="/my" data-design-text-token="body-sm" class="font-body text-body-sm text-ink px-sm py-xs rounded-md hover:bg-surface-2">마이페이지</a>
        <a href="/logout" data-design-text-token="body-sm" class="font-body text-body-sm text-ink-muted px-sm py-xs rounded-md hover:text-ink">로그아웃</a>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-3xl w-full mx-auto px-lg py-xxl flex flex-col gap-xl">
    <div class="flex flex-col gap-xs">
      <span data-design-text-token="eyebrow" class="font-eyebrow text-eyebrow text-ink-muted">수강 지원</span>
      <h1 data-design-text-token="display-md" class="font-display text-display-md-mobile md:text-display-md text-ink">지원서 작성</h1>
    </div>

    <!-- 1. 기수 요약 -->
    <section class="bg-surface-1 border border-hairline rounded-xl p-lg flex flex-col md:flex-row md:items-center justify-between gap-md">
      <div class="flex flex-col gap-xxs">
        <span data-design-text-token="caption" class="font-caption text-caption text-ink-muted">백엔드 · 12기</span>
        <h2 data-design-text-token="card-title" class="font-card text-card-title text-ink">백엔드 자바 스프링 부트캠프</h2>
        <span data-design-text-token="body-sm" class="font-body text-body-sm text-ink-muted tabular-nums">교육 기간 2027.01.04 ~ 2027.04.23</span>
      </div>
      <div class="flex flex-col md:items-end gap-xxs">
        <span data-design-text-token="caption" class="font-caption text-caption text-ink-muted">수강료</span>
        <span data-design-text-token="headline" class="font-headline text-headline text-ink tabular-nums">4,200,000원</span>
      </div>
    </section>

    <form class="bg-surface-1 border border-hairline rounded-xl p-xl flex flex-col gap-xl">
      <!-- 2. 지원자 정보 (읽기 전용) -->
      <section class="flex flex-col gap-md pb-lg border-b border-hairline-soft">
        <h2 data-design-text-token="card-title" class="font-card text-card-title text-ink">지원자 정보</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-md">
          <div class="flex flex-col gap-xs">
            <label for="applicant-name" data-design-text-token="body-sm" class="font-body text-body-sm text-ink-muted">이름 (자동 입력)</label>
            <input id="applicant-name" type="text" value="김서연" readonly class="bg-surface-2 border border-hairline rounded-md px-sm py-sm min-h-11 font-body text-body text-ink cursor-not-allowed">
          </div>
          <div class="flex flex-col gap-xs">
            <label for="applicant-phone" data-design-text-token="body-sm" class="font-body text-body-sm text-ink-muted">연락처 (자동 입력)</label>
            <input id="applicant-phone" type="tel" value="010-4821-9034" readonly class="bg-surface-2 border border-hairline rounded-md px-sm py-sm min-h-11 font-body text-body text-ink tabular-nums cursor-not-allowed">
          </div>
        </div>
      </section>

      <!-- 3. 지원 문항 -->
      <section class="flex flex-col gap-lg">
        <h2 data-design-text-token="card-title" class="font-card text-card-title text-ink">지원 문항</h2>
        <div class="flex flex-col gap-xs">
          <label for="motivation" data-design-text-token="body-sm" class="font-body text-body-sm text-ink">지원 동기 *</label>
          <textarea id="motivation" rows="5" required placeholder="부트캠프에 지원하는 이유와 수료 후 목표를 작성해 주세요." class="bg-surface-1 border border-hairline rounded-md p-sm font-body text-body text-ink placeholder:text-ink-muted focus:border-ink focus:ring-0"></textarea>
        </div>
        <div class="flex flex-col gap-xs">
          <label for="experience" data-design-text-token="body-sm" class="font-body text-body-sm text-ink">관련 경험 (선택)</label>
          <textarea id="experience" rows="4" placeholder="학습 경험, 프로젝트, GitHub 주소 등이 있다면 자유롭게 작성해 주세요." class="bg-surface-1 border border-hairline rounded-md p-sm font-body text-body text-ink placeholder:text-ink-muted focus:border-ink focus:ring-0"></textarea>
        </div>
        <div class="flex flex-col gap-xs">
          <label for="channel" data-design-text-token="body-sm" class="font-body text-body-sm text-ink">유입 경로</label>
          <select id="channel" class="bg-surface-1 border border-hairline rounded-md px-sm py-sm min-h-11 font-body text-body text-ink focus:border-ink focus:ring-0">
            <option value>선택해 주세요</option>
            <option value="search">검색 (네이버 · 구글)</option>
            <option value="sns">SNS · 개발자 커뮤니티</option>
            <option value="referral">지인 및 수료생 추천</option>
          </select>
        </div>
      </section>

      <!-- 4. 동의 & 5. 제출 -->
      <div class="flex flex-col gap-lg pt-md border-t border-hairline-soft">
        <label class="flex items-start gap-sm cursor-pointer">
          <input type="checkbox" required class="mt-xxs rounded-xs border-hairline text-primary focus:ring-primary">
          <span data-design-text-token="body-sm" class="font-body text-body-sm text-ink">개인정보 수집·이용에 동의합니다 (필수)</span>
        </label>
        <button type="submit" data-component-id="button-primary" data-component-type="button" data-component-variant="primary" class="w-full inline-flex items-center justify-center bg-primary text-on-primary font-button text-button px-md py-sm min-h-12 rounded-md hover:opacity-90">
          <span data-design-text-token="button">지원서 제출</span>
        </button>
      </div>
    </form>
  </main>

  <!-- Footer -->
  <footer class="bg-canvas border-t border-hairline">
    <div class="max-w-[1280px] mx-auto px-lg py-xxl flex flex-col md:flex-row justify-between gap-xl">
      <div class="flex flex-col gap-sm">
        <span data-design-text-token="button" class="font-button text-button text-ink">커리어랩</span>
        <p data-design-text-token="caption" class="font-caption text-caption text-ink-muted">주식회사 커리어랩 · 대표 김태현 · 고객센터 02-6410-8200</p>
      </div>
      <div class="flex flex-wrap items-center gap-lg">
        <a href="/terms" data-design-text-token="caption" class="font-caption text-caption text-ink-muted hover:text-ink">이용약관</a>
        <a href="/privacy" data-design-text-token="caption" class="font-caption text-caption text-ink-muted hover:text-ink">개인정보처리방침</a>
        <a href="/refund" data-design-text-token="caption" class="font-caption text-caption text-ink-muted hover:text-ink">환불 규정</a>
      </div>
    </div>
  </footer>


</body></html>
