  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=block" rel="stylesheet">
  <style>.material-symbols-outlined, .material-symbols-rounded, .material-symbols-sharp, .material-icons { display: inline-block; width: 1em; height: 1em; line-height: 1 !important; box-sizing: content-box; overflow: hidden; white-space: nowrap; direction: ltr; vertical-align: middle; }</style>

<body class="bg-canvas text-ink font-body antialiased min-h-[1024px] flex" data-stitch-vh="min-h-[1024px]===min-h-screen">

  <!-- Admin Sidebar -->
  <aside class="w-60 shrink-0 bg-surface-1 border-r border-hairline min-h-[1024px] flex flex-col justify-between p-lg" data-stitch-vh="min-h-[1024px]===min-h-screen">
    <div class="flex flex-col gap-xl">
      <a href="/admin" class="inline-flex items-center gap-xs text-ink">
        <span class="w-6 h-6 rounded-xs bg-primary text-on-primary inline-flex items-center justify-center font-mono text-caption">C</span>
        <span data-design-text-token="button" class="font-button text-button text-ink">커리어랩</span>
        <span data-design-text-token="caption" class="font-caption text-caption bg-surface-2 text-ink-muted px-xs py-xxs rounded-xs">관리자</span>
      </a>
      <nav aria-label="관리자 메뉴" class="flex flex-col gap-xxs">
        <a href="/admin" data-design-text-token="body-sm" class="text-ink-muted font-body text-body-sm px-sm py-sm rounded-md hover:text-ink hover:bg-canvas">대시보드</a>
        <a href="/admin/courses" data-design-text-token="body-sm" class="text-ink-muted font-body text-body-sm px-sm py-sm rounded-md hover:text-ink hover:bg-canvas">과정 관리</a>
        <a href="/admin/cohorts" data-design-text-token="body-sm" class="bg-surface-2 text-ink font-body text-body-sm px-sm py-sm rounded-md">기수 관리</a>
        <a href="/admin/cohorts/12/applications" data-design-text-token="body-sm" class="text-ink-muted font-body text-body-sm px-sm py-sm rounded-md hover:text-ink hover:bg-canvas">지원자 심사</a>
        <a href="/admin/payments" data-design-text-token="body-sm" class="text-ink-muted font-body text-body-sm px-sm py-sm rounded-md hover:text-ink hover:bg-canvas">결제·환불 관리</a>
      </nav>
    </div>
    <div class="pt-md border-t border-hairline-soft flex items-center justify-between">
      <span data-design-text-token="body-sm" class="font-body text-body-sm text-ink">운영자 김민수</span>
      <a href="/logout" data-design-text-token="caption" class="font-caption text-caption text-ink-muted hover:text-ink">로그아웃</a>
    </div>
  </aside>

  <main class="flex-1 p-xl flex flex-col gap-xl min-w-0">
    <div class="flex items-center justify-between">
      <h1 data-design-text-token="display-md" class="font-display text-display-md-mobile md:text-display-md text-ink">기수 관리</h1>
      <button type="button" data-component-id="button-primary" data-component-type="button" data-component-variant="primary" class="inline-flex items-center justify-center bg-primary text-on-primary font-button text-button px-md py-sm min-h-10 rounded-md hover:opacity-90">
        <span data-design-text-token="button">기수 등록</span>
      </button>
    </div>

    <!-- 1. 필터 -->
    <div class="flex flex-wrap items-center gap-sm">
      <select aria-label="과정 필터" class="bg-surface-1 border border-hairline rounded-md px-sm py-xs min-h-10 font-body text-body-sm text-ink">
        <option>전체 과정</option>
        <option>백엔드 자바 스프링 부트캠프</option>
        <option>프론트엔드 React &amp; TS 부트캠프</option>
      </select>
      <select aria-label="상태 필터" class="bg-surface-1 border border-hairline rounded-md px-sm py-xs min-h-10 font-body text-body-sm text-ink">
        <option>전체 상태</option>
        <option>모집예정</option>
        <option>모집중</option>
        <option>교육중</option>
      </select>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-xl items-start">
      <!-- 2. 기수 목록 -->
      <section class="lg:col-span-7 bg-surface-1 border border-hairline rounded-xl overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="border-b border-hairline bg-canvas">
              <th class="px-md py-sm font-caption text-caption text-ink-muted">과정·기수</th>
              <th class="px-md py-sm font-caption text-caption text-ink-muted">모집 기간</th>
              <th class="px-md py-sm font-caption text-caption text-ink-muted">정원/최소</th>
              <th class="px-md py-sm font-caption text-caption text-ink-muted">확정</th>
              <th class="px-md py-sm font-caption text-caption text-ink-muted">가격</th>
              <th class="px-md py-sm font-caption text-caption text-ink-muted">상태</th>
              <th class="px-md py-sm font-caption text-caption text-ink-muted text-right">관리</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-hairline-soft">
            <tr>
              <td class="px-md py-md font-body text-body-sm text-ink">백엔드 12기</td>
              <td class="px-md py-md font-body text-body-sm text-ink-muted tabular-nums">11.20~12.15</td>
              <td class="px-md py-md font-body text-body-sm text-ink tabular-nums">30 / 10</td>
              <td class="px-md py-md font-body text-body-sm text-ink tabular-nums">22</td>
              <td class="px-md py-md font-body text-body-sm text-ink tabular-nums">4,200,000원</td>
              <td class="px-md py-md font-caption text-caption text-ink">모집중</td>
              <td class="px-md py-md text-right"><button type="button" class="font-caption text-caption text-ink underline whitespace-nowrap">수정</button></td>
            </tr>
            <tr>
              <td class="px-md py-md font-body text-body-sm text-ink">백엔드 11기</td>
              <td class="px-md py-md font-body text-body-sm text-ink-muted tabular-nums">08.01~08.31</td>
              <td class="px-md py-md font-body text-body-sm text-ink tabular-nums">30 / 10</td>
              <td class="px-md py-md font-body text-body-sm text-ink tabular-nums">29</td>
              <td class="px-md py-md font-body text-body-sm text-ink tabular-nums">4,200,000원</td>
              <td class="px-md py-md font-caption text-caption text-ink-muted">교육중</td>
              <td class="px-md py-md text-right"><button type="button" class="font-caption text-caption text-ink underline whitespace-nowrap">수정</button></td>
            </tr>
            <tr>
              <td class="px-md py-md font-body text-body-sm text-ink">PM 7기</td>
              <td class="px-md py-md font-body text-body-sm text-ink-muted tabular-nums">01.10~02.05</td>
              <td class="px-md py-md font-body text-body-sm text-ink tabular-nums">25 / 8</td>
              <td class="px-md py-md font-body text-body-sm text-ink tabular-nums">0</td>
              <td class="px-md py-md font-body text-body-sm text-ink tabular-nums">3,400,000원</td>
              <td class="px-md py-md font-caption text-caption text-ink-muted">모집예정</td>
              <td class="px-md py-md text-right"><button type="button" class="font-caption text-caption text-ink underline whitespace-nowrap">수정</button></td>
            </tr>
          </tbody>
        </table>
      </section>

      <!-- 3. 기수 등록·수정 폼 -->
      <section class="lg:col-span-5 bg-surface-1 border border-hairline rounded-xl p-lg flex flex-col gap-md">
        <h2 data-design-text-token="card-title" class="font-card text-card-title text-ink">기수 등록 · 수정</h2>
        <form class="flex flex-col gap-md">
          <div class="grid grid-cols-2 gap-sm">
            <div class="flex flex-col gap-xs">
              <label for="cohort-course" data-design-text-token="caption" class="font-caption text-caption text-ink">과정 *</label>
              <select id="cohort-course" class="bg-surface-1 border border-hairline rounded-md px-sm py-xs min-h-10 font-body text-body-sm text-ink">
                <option>백엔드 자바 스프링</option>
              </select>
            </div>
            <div class="flex flex-col gap-xs">
              <label for="cohort-num" data-design-text-token="caption" class="font-caption text-caption text-ink">기수 번호 *</label>
              <input id="cohort-num" type="number" value="12" class="bg-surface-1 border border-hairline rounded-md px-sm py-xs min-h-10 font-body text-body-sm text-ink tabular-nums">
            </div>
          </div>
          <div class="grid grid-cols-2 gap-sm">
            <div class="flex flex-col gap-xs">
              <label for="rec-start" data-design-text-token="caption" class="font-caption text-caption text-ink">모집 시작</label>
              <input id="rec-start" type="text" value="2026.11.20" class="bg-surface-1 border border-hairline rounded-md px-sm py-xs min-h-10 font-body text-body-sm text-ink tabular-nums">
            </div>
            <div class="flex flex-col gap-xs">
              <label for="rec-end" data-design-text-token="caption" class="font-caption text-caption text-ink">모집 마감</label>
              <input id="rec-end" type="text" value="2026.12.15" class="bg-surface-1 border border-hairline rounded-md px-sm py-xs min-h-10 font-body text-body-sm text-ink tabular-nums">
            </div>
          </div>
          <div class="grid grid-cols-2 gap-sm">
            <div class="flex flex-col gap-xs">
              <label for="cap" data-design-text-token="caption" class="font-caption text-caption text-ink">정원</label>
              <input id="cap" type="number" value="30" class="bg-surface-1 border border-hairline rounded-md px-sm py-xs min-h-10 font-body text-body-sm text-ink tabular-nums">
            </div>
            <div class="flex flex-col gap-xs">
              <label for="min-cap" data-design-text-token="caption" class="font-caption text-caption text-ink">최소 인원</label>
              <input id="min-cap" type="number" value="10" class="bg-surface-1 border border-hairline rounded-md px-sm py-xs min-h-10 font-body text-body-sm text-ink tabular-nums">
            </div>
          </div>
          <div class="flex flex-col gap-xs">
            <label for="price" data-design-text-token="caption" class="font-caption text-caption text-ink">가격(원) *</label>
            <input id="price" type="text" value="4,200,000" class="bg-surface-1 border border-hairline rounded-md px-sm py-xs min-h-10 font-body text-body-sm text-ink tabular-nums">
          </div>
          <div class="flex items-center gap-lg">
            <label class="inline-flex items-center gap-xs"><input type="radio" name="funding" checked class="text-primary"> <span data-design-text-token="body-sm" class="font-body text-body-sm text-ink">자비</span></label>
            <label class="inline-flex items-center gap-xs"><input type="radio" name="funding" class="text-primary"> <span data-design-text-token="body-sm" class="font-body text-body-sm text-ink">국비지원</span></label>
          </div>
          <div class="flex items-center gap-sm pt-sm border-t border-hairline-soft">
            <button type="submit" data-component-id="button-primary" data-component-type="button" data-component-variant="primary" class="flex-1 inline-flex items-center justify-center bg-primary text-on-primary font-button text-button px-md py-sm min-h-10 rounded-md hover:opacity-90">
              <span data-design-text-token="button">저장</span>
            </button>
            <button type="button" data-component-id="button-secondary" data-component-type="button" data-component-variant="secondary" class="inline-flex items-center justify-center bg-surface-1 text-ink border border-hairline font-button text-button px-md py-sm min-h-10 rounded-md hover:bg-surface-2">
              <span data-design-text-token="button">취소</span>
            </button>
          </div>
        </form>
      </section>
    </div>
  </main>


</body></html>
